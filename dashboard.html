<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Assistant - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">
    <div class="header-row">
      <div>
        <h1>Medical Assistant</h1>
        <p class="subtitle">Search government health facilities by district name</p>
      </div>
      <button onclick="handleLogout()" class="btn-logout">Logout</button>
    </div>

    <!-- Search Form -->
    <form id="searchForm" class="search-form">
      <input 
        type="text" 
        id="district" 
        placeholder="Enter district name (e.g., Bangalore, Mysore, Pune)"
        required
      >
      <button type="submit" id="searchBtn">Search Hospitals</button>
    </form>

    <!-- Error/Status Message -->
    <p id="error" class="error"></p>

    <!-- Results Section -->
    <div id="resultsWrapper" style="display: none;">
      <h2 id="resultsHeading">Search Results</h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Facility Name</th>
              <th>Address</th>
              <th>PIN Code</th>
              <th>Type</th>
              <th>District</th>
              <th>Phone</th>
            </tr>
          </thead>
          <tbody id="hospitalTableBody">
            <!-- Rows inserted by JavaScript -->
          </tbody>
        </table>
      </div>

      <p class="note">
        * Confirm with the facility that it is government-run before visiting.
      </p>
    </div>

    <p class="note footer-note">
      Data source: Hospital Directory of India. Information may be incomplete or outdated.
    </p>
  </div>

  <script>
    // 1. Guard check: Must be logged in
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "login.html";
    }

    // 2. Logout function
    function handleLogout() {
      localStorage.removeItem("isLoggedIn");
      window.location.href = "login.html";
    }

    // 3. Search Hospitals
    const searchForm = document.getElementById("searchForm");
    const districtInput = document.getElementById("district");
    const searchBtn = document.getElementById("searchBtn");
    const errorEl = document.getElementById("error");
    const resultsWrapper = document.getElementById("resultsWrapper");
    const resultsHeading = document.getElementById("resultsHeading");
    const tableBody = document.getElementById("hospitalTableBody");

    searchForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      const district = districtInput.value.trim();
      if (!district) {
        errorEl.textContent = "Please enter a district name";
        resultsWrapper.style.display = "none";
        return;
      }

      // Reset state & show loading
      errorEl.textContent = "";
      resultsWrapper.style.display = "none";
      tableBody.innerHTML = "";
      searchBtn.textContent = "Searching...";
      searchBtn.disabled = true;

      const params = new URLSearchParams({
        where: `district_name LIKE '%${district.replace(/'/g, "''")}%'`,
        outFields: "health_facility_name,address,posatalcode,landline_number,facility_type,state_name,district_name",
        returnGeometry: "false",
        resultRecordCount: "100",
        f: "json"
      });

      try {
        const response = await fetch(
          "https://livingatlas.esri.in/server/rest/services/LivingAtlas/IND_Hospital_Directory/MapServer/0/query?" +
            params.toString()
        );

        if (!response.ok) {
          throw new Error("API request failed");
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || "API error");
        }

        const hospitals = data.features || [];

        if (hospitals.length === 0) {
          errorEl.textContent = "No health facilities found in this district.";
          return;
        }

        // Save recent search
        const previousSearches = JSON.parse(localStorage.getItem("recentSearches") || "[]");
        const updatedSearches = [
          district,
          ...previousSearches.filter((item) => item.toLowerCase() !== district.toLowerCase())
        ].slice(0, 5);
        localStorage.setItem("recentSearches", JSON.stringify(updatedSearches));

        // Display results
        resultsHeading.textContent = `Search Results (${hospitals.length})`;
        tableBody.innerHTML = "";

        hospitals.forEach((item) => {
          const h = item.attributes;
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td><strong>${h.health_facility_name || "N/A"}</strong></td>
            <td>${h.address || "N/A"}</td>
            <td>${h.posatalcode || "N/A"}</td>
            <td><span class="badge">${h.facility_type || "N/A"}</span></td>
            <td>${h.district_name || "N/A"}</td>
            <td>${h.landline_number || "N/A"}</td>
          `;

          tableBody.appendChild(tr);
        });

        resultsWrapper.style.display = "block";
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Could not load hospital data. Check your internet and try again.";
      } finally {
        searchBtn.textContent = "Search Hospitals";
        searchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
