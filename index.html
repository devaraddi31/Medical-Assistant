<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Assistant - Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .input-error {
      border-color: #dc2626 !important;
      background-color: #fef2f2;
    }
    .field-error {
      color: #dc2626;
      font-size: 0.8rem;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Medical Assistant</h1>
    <p class="subtitle">Login to find health facilities</p>

    <!-- General Error Banner -->
    <div id="generalError" class="error"></div>

    <form id="loginForm" novalidate>
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username">
        <span id="usernameError" class="field-error"></span>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
        <span id="passwordError" class="field-error"></span>
      </div>

      <button type="submit" class="btn" id="loginBtn">Login</button>
    </form>

    <div class="demo-info">
      <p><strong>Demo username:</strong> admin</p>
      <p><strong>Demo password:</strong> admin123</p>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem("isLoggedIn") === "true") {
      window.location.href = "dashboard.html";
    }

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const usernameError = document.getElementById("usernameError");
    const passwordError = document.getElementById("passwordError");
    const generalError = document.getElementById("generalError");

    // Clear errors when typing
    usernameInput.addEventListener("input", function () {
      usernameInput.classList.remove("input-error");
      usernameError.textContent = "";
      generalError.textContent = "";
      generalError.style.display = "none";
    });

    passwordInput.addEventListener("input", function () {
      passwordInput.classList.remove("input-error");
      passwordError.textContent = "";
      generalError.textContent = "";
      generalError.style.display = "none";
    });

    // Form Submission & Validation
    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      let isValid = true;

      // 1. Username validation
      if (!username) {
        usernameInput.classList.add("input-error");
        usernameError.textContent = "Username is required";
        isValid = false;
      } else if (username.length < 3) {
        usernameInput.classList.add("input-error");
        usernameError.textContent = "Username must be at least 3 characters";
        isValid = false;
      }

      // 2. Password validation
      if (!password) {
        passwordInput.classList.add("input-error");
        passwordError.textContent = "Password is required";
        isValid = false;
      } else if (password.length < 4) {
        passwordInput.classList.add("input-error");
        passwordError.textContent = "Password must be at least 4 characters";
        isValid = false;
      }

      if (!isValid) return;

      // 3. Credential check
      if (username === "admin" && password === "admin123") {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("currentUser", username);
        window.location.href = "dashboard.html";
      } else {
        generalError.textContent = "Invalid username or password!";
        generalError.style.display = "block";
      }
    });
  </script>
</body>
</html>
